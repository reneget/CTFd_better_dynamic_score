{% extends "admin/challenges/update.html" %}

{% block value %}
<div class="form-group">
  <label>Current Value</label>
  <input type="number" class="form-control" value="{{ challenge.value }}" disabled>
</div>
<div class="form-group">
  <label>Initial Value</label>
  <input type="number" class="form-control" name="initial" value="{{ challenge.initial }}" required>
</div>
<div class="form-group">
  <label>Decay</label>
  <input type="number" class="form-control" name="decay" value="{{ challenge.decay }}" min="1" required>
</div>
<div class="form-group">
  <label>Minimum Value</label>
  <input type="number" class="form-control" name="minimum" value="{{ challenge.minimum }}" required>
</div>
{% endblock %}

{% block function %}{% endblock %}
{% block initial %}{% endblock %}
{% block decay %}{% endblock %}
{% block minimum %}{% endblock %}
